name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="$MANUAL_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ || "${version^^}" == *SNAPSHOT* ]]; then
            echo "Invalid Maven release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bridges:
    name: Build native bridge (${{ matrix.id }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-aarch64
            runner: ubuntu-24.04-arm
          - id: windows-x86_64
            runner: windows-2025
          - id: macos-x86_64
            runner: macos-15-intel
          - id: macos-aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install GLib development dependencies
        if: startsWith(matrix.id, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libglib2.0-dev
      - uses: msys2/setup-msys2@v2
        if: startsWith(matrix.id, 'windows-')
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose MinGW tools
        if: startsWith(matrix.id, 'windows-')
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Compile JVM native bridge
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --no-configuration-cache :kmedia-notification:compileJvmBridge
      - name: Build Kotlin/Native arm64 bridge
        if: matrix.id == 'linux-aarch64'
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --no-configuration-cache :kmedia-notification:archiveSystemMediaLinuxArm64
      - uses: actions/upload-artifact@v4
        with:
          name: kmedia-jvm-native-${{ matrix.id }}-${{ needs.prepare.outputs.version }}
          path: kmedia-notification/build/generated/jvmNative/native/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: matrix.id == 'linux-aarch64'
        with:
          name: kmedia-native-linux-arm64-${{ needs.prepare.outputs.version }}
          path: kmedia-notification/build/native/system-media/linuxArm64/libkmedia_notification.a
          if-no-files-found: error
          retention-days: 5

  platform:
    name: Build Maven shard (${{ matrix.id }})
    needs: [prepare, bridges]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android
            runner: ubuntu-24.04
            publication: Android
          - id: jvm
            runner: ubuntu-24.04
            publication: Jvm
          - id: js
            runner: ubuntu-24.04
            publication: Js
          - id: wasm-js
            runner: ubuntu-24.04
            publication: WasmJs
          - id: linux-x64
            runner: ubuntu-24.04
            publication: LinuxX64
          - id: linux-arm64
            runner: ubuntu-24.04
            publication: LinuxArm64
          - id: windows-x64
            runner: windows-2025
            publication: MingwX64
          - id: macos-x64
            runner: macos-15-intel
            publication: MacosX64
          - id: macos-arm64
            runner: macos-15
            publication: MacosArm64
          - id: ios-arm64
            runner: macos-15
            publication: IosArm64
          - id: ios-x64
            runner: macos-15-intel
            publication: IosX64
          - id: ios-simulator-arm64
            runner: macos-15
            publication: IosSimulatorArm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        if: matrix.id == 'android'
      - name: Install Android SDK
        if: matrix.id == 'android'
        shell: bash
        run: |
          sdk_platform="$(sed -n 's/^androidSdkPlatformVersion=//p' gradle.properties)"
          build_tools="$(sed -n 's/^androidBuildToolsVersion=//p' gradle.properties)"
          sdkmanager "platforms;android-$sdk_platform" "build-tools;$build_tools"
      - name: Install GLib development dependencies
        if: matrix.id == 'jvm' || matrix.id == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libglib2.0-dev
      - uses: msys2/setup-msys2@v2
        if: matrix.id == 'windows-x64'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose MinGW tools
        if: matrix.id == 'windows-x64'
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Verify Xcode
        if: startsWith(matrix.id, 'macos-') || startsWith(matrix.id, 'ios-')
        run: xcodebuild -version
      - uses: actions/download-artifact@v4
        if: matrix.id == 'jvm'
        with:
          pattern: kmedia-jvm-native-*-${{ needs.prepare.outputs.version }}
          path: build/jvm-native-shards
      - name: Assemble JVM bridge resources
        if: matrix.id == 'jvm'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for target in linux-x86_64 linux-aarch64 windows-x86_64 macos-x86_64 macos-aarch64; do
            mkdir -p "build/jvm-native/$target"
            cp -a "build/jvm-native-shards/kmedia-jvm-native-$target-$RELEASE_VERSION/." "build/jvm-native/$target/"
          done
          echo "KMEDIA_JVM_NATIVE_DIR=$GITHUB_WORKSPACE/build/jvm-native" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: matrix.id == 'linux-arm64'
        with:
          name: kmedia-native-linux-arm64-${{ needs.prepare.outputs.version }}
          path: build/prebuilt-linux-arm64
      - name: Build Maven publication shard
        shell: bash
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          PUBLICATION: ${{ matrix.publication }}
          TARGET_ID: ${{ matrix.id }}
          KMEDIA_NOTIFICATION_MINGW_X64_CC: g++
          KMEDIA_NOTIFICATION_MINGW_X64_AR: ar
        run: |
          set -euo pipefail
          if [[ "$TARGET_ID" == linux-arm64 ]]; then
            export KMEDIA_NOTIFICATION_LINUX_ARM64_PREBUILT_ARCHIVE="$GITHUB_WORKSPACE/build/prebuilt-linux-arm64/libkmedia_notification.a"
            test -s "$KMEDIA_NOTIFICATION_LINUX_ARM64_PREBUILT_ARCHIVE"
          fi
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            ":kmedia-notification:publish${PUBLICATION}PublicationToReleaseShardRepository"
      - uses: actions/upload-artifact@v4
        with:
          name: kmedia-repo-${{ matrix.id }}-${{ needs.prepare.outputs.version }}
          path: build/maven-release-shard
          if-no-files-found: error
          retention-days: 5

  metadata:
    name: Build KMP root metadata shard
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build root publication
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: ./gradlew --no-daemon --stacktrace --no-configuration-cache :kmedia-notification:publishKotlinMultiplatformPublicationToReleaseShardRepository
      - uses: actions/upload-artifact@v4
        with:
          name: kmedia-repo-metadata-${{ needs.prepare.outputs.version }}
          path: build/maven-release-shard
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Sign and publish Maven Central deployment
    needs: [prepare, platform, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: kmedia-repo-*-${{ needs.prepare.outputs.version }}
          path: release/shards
      - name: Merge and verify Maven shards
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release/merged
          for repository in release/shards/kmedia-repo-*; do
            cp -a "$repository/." release/merged/
          done
          python3 scripts/prepare-maven-central-bundle.py \
            --repository release/merged --staging release/verified \
            --version "$RELEASE_VERSION" --require-all-targets
      - name: Restore Maven Central credentials and signing key
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES_CONTENT }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          properties_file="$gradle_dir/gradle.properties"
          keyring="$gradle_dir/kmedianotification-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$properties_file"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | openssl base64 -d -A > "$keyring"
          test -s "$keyring"
          awk '!/^signing.secretKeyRingFile=/' "$properties_file" > "$properties_file.tmp"
          mv "$properties_file.tmp" "$properties_file"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$properties_file"
          chmod 600 "$properties_file" "$keyring"
          for property in mavenCentralUsername mavenCentralPassword signing.keyId signing.password; do
            grep -Eq "^${property//./\\.}=.+" "$properties_file" || {
              echo "GRADLE_PROPERTIES_CONTENT is missing required property '$property'" >&2
              exit 1
            }
          done
      - name: Sign and upload one Maven Central deployment
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash scripts/publish-maven-central-bundle.sh \
            "$GITHUB_WORKSPACE/release/merged" "$RELEASE_VERSION" \
            "$GITHUB_WORKSPACE/release/kmedianotification-$RELEASE_VERSION.zip"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-kmedia-central-bundle-${{ needs.prepare.outputs.version }}
          path: release/kmedianotification-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: ignore
          retention-days: 5
      - name: Remove publishing credentials
        if: always()
        run: |
          rm -f "$HOME/.gradle/gradle.properties" "$HOME/.gradle/kmedianotification-secret-key.gpg"
          rm -rf release/gpg

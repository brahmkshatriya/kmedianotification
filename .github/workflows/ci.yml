name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libglib2.0-dev dbus
          sdk_platform="$(sed -n 's/^androidSdkPlatformVersion=//p' gradle.properties)"
          build_tools="$(sed -n 's/^androidBuildToolsVersion=//p' gradle.properties)"
          sdkmanager "platforms;android-$sdk_platform" "build-tools;$build_tools"
      - name: Check library and local publications
        run: |
          dbus-run-session -- ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            -PVERSION_NAME=0.0.0-ci \
            :lib:jvmTest \
            :lib:publishJvmPublicationToReleaseShardRepository \
            :lib:publishAndroidPublicationToReleaseShardRepository \
            :lib:publishJsPublicationToReleaseShardRepository \
            :lib:publishWasmJsPublicationToReleaseShardRepository \
            :lib:publishLinuxX64PublicationToReleaseShardRepository \
            :lib:publishKotlinMultiplatformPublicationToReleaseShardRepository
          python3 scripts/prepare-maven-central-bundle.py \
            --repository build/maven-release-shard --staging build/central-check --version 0.0.0-ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-reports
          path: lib/build/reports
          if-no-files-found: ignore
          retention-days: 5
